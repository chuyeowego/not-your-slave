name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mindlog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mindlog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MINDLOG_TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/mindlog_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
